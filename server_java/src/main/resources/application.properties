# ============================================================
# FARMO AI JAVA SPRING BOOT MICROSERVICES CONFIGURATION
# ============================================================

server.port=8080
spring.application.name=farmo-ai-microservices

# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/farmo_ai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin@123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Level
logging.level.com.farmoai.microservices=DEBUG
